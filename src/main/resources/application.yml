server:
  port: 24681
  servlet:
    session:
      timeout: 2h

spring:
  application:
    name: psychological-counseling-backend
  datasource:
    url: jdbc:mysql://localhost:3306/psychological_counseling?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  default-password: 123456

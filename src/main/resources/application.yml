server:
  port: 24681
  servlet:
    session:
      timeout: 2h

spring:
  application:
    name: psychological-counseling-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/psychological_counseling?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.tyut.psychological.*.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  default-password: 123456
